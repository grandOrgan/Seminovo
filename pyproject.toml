[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seminovo"
version = "0.1.0"
description = "Semi-supervised de novo peptide sequencing from unlabeled mass spectra"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Pan Liu"}]
keywords = [
  "mass-spectrometry",
  "proteomics",
  "de-novo-peptide-sequencing",
  "semi-supervised-learning",
]
dependencies = [
  "depthcharge-ms==0.2.3",
  "einops>=0.7",
  "lightning==2.1.4",
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "polars==0.20.10",
  "pyarrow>=14",
  "pyyaml>=6",
  "scikit-learn>=1.3",
  "spectrum-utils>=0.4",
  "tensorboard>=2.14",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
seminovo-train = "seminovo.train:main"
seminovo-train-semi = "seminovo.train_semi:main"
seminovo-evaluate = "seminovo.evaluate:main"

[tool.setuptools.packages.find]
include = ["seminovo*", "novobench*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA GPU and FlashAttention",
]
